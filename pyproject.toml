[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keelbook-web"
version = "0.0.1"
description = "Web interface for the Keelbook vulnerability register (EU Cyber Resilience Act)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary. All rights reserved." }
dependencies = [
    # The engine: parsing, vulnerability lookup, register, Art. 14 cases, evidence.
    "keelbook @ git+https://github.com/andrei-saveli/keelbook@v0.9.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
keelbook-web = "keelbook_web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keelbook_web = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
